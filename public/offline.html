<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>You're offline · SattaKing Pro</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at 50% 0%, #1a1305 0%, #0a0a0a 60%);
        color: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 88px; height: 88px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f5c542, #b8860b);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 40px -10px rgba(245, 197, 66, 0.5);
      }
      .icon svg { width: 44px; height: 44px; color: #0a0a0a; }
      h1 { font-size: 1.5rem; margin: 0 0 8px; font-weight: 700; }
      p { margin: 0 0 24px; color: #a3a3a3; font-size: 0.95rem; line-height: 1.5; }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      button, a.btn {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        text-decoration: none;
        transition: transform 0.1s, opacity 0.2s;
      }
      .primary { background: linear-gradient(135deg, #f5c542, #b8860b); color: #0a0a0a; }
      .secondary { background: transparent; color: #f5f5f5; border: 1px solid #2a2a2a; }
      button:active, a.btn:active { transform: scale(0.97); }
      .status {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #737373;
        display: flex; align-items: center; justify-content: center; gap: 6px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
      .dot.online { background: #22c55e; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22"/>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <line x1="12" y1="20" x2="12.01" y2="20"/>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>We couldn't reach the network. Check your connection — the app will be back as soon as you're online.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a class="btn secondary" href="/">Go home</a>
      </div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Offline</span>
      </div>
    </main>
    <script>
      function update() {
        var on = navigator.onLine;
        document.getElementById('dot').className = 'dot' + (on ? ' online' : '');
        document.getElementById('statusText').textContent = on ? 'Back online — tap Try again' : 'Offline';
      }
      window.addEventListener('online', function () { update(); location.reload(); });
      window.addEventListener('offline', update);
      update();
    </script>
  </body>
</html>
